<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Body Sculpt</title>

<style>
  :root{
    --gap: 20px;
    --cols: 3;

    --bg0: #0b0f14;
    --bg1: #0f1722;

    --text: rgba(255,255,255,.92);
    --gold2:#f2deaa;
    --danger:#ff5c6e;

    --shadow: 0 16px 45px rgba(0,0,0,.55);
    --shadow2: 0 10px 28px rgba(0,0,0,.45);
    --radius: 14px;
  }

  html.modal-open,
  body.modal-open{
    overflow:hidden !important;
    overscroll-behavior:none;
    touch-action:none;
  }

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--text);
    padding:20px;

    background:
      radial-gradient(1200px 900px at 15% 10%, rgba(61,214,198,.12), transparent 55%),
      radial-gradient(900px 700px at 85% 20%, rgba(215,180,106,.12), transparent 52%),
      radial-gradient(900px 700px at 55% 95%, rgba(255,255,255,.06), transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    display:flex;
    flex-wrap:wrap;
    gap:var(--gap);
    justify-content:space-around;
  }

  #groupsRoot{
    width:100%;
    display:grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap:var(--gap);
    justify-items:stretch;
    align-items:stretch;
  }

  .thumbnail-container{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;

    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.10);
    box-shadow: var(--shadow2);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }

  .thumbnail-container:hover{
    transform: translateY(-3px) scale(1.03);
    border-color: rgba(215,180,106,.35);
    box-shadow: 0 18px 52px rgba(0,0,0,.60);
  }

  .thumbnail-container img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter: saturate(1.05) contrast(1.05);
    transform: scale(1.02);
  }

  .thumbnail-container::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.12), transparent 35%),
      radial-gradient(500px 500px at 20% 20%, rgba(215,180,106,.10), transparent 55%);
    pointer-events:none;
    mix-blend-mode: screen;
    opacity:.55;
  }

  .label{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;

    padding:10px 10px;
    border-radius:12px;

    background:
      linear-gradient(180deg, rgba(12,16,22,.65), rgba(12,16,22,.45));
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    text-align:center;
    font-weight:900;
    letter-spacing:.35px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    font-size:18px;
    line-height:1.1;

    box-shadow: 0 10px 26px rgba(0,0,0,.45);
  }

  .tile-actions{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:5;

    opacity:0;
    pointer-events:none;
    transform:translateY(-6px);
    transition:opacity .15s ease, transform .15s ease;
  }
  .thumbnail-container.show-actions .tile-actions{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .icon-btn{
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
    color: var(--text);
    border-radius:12px;
    padding:10px 11px;
    font-weight:900;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn:active{ transform:scale(.98); }
  .icon-btn.danger{
    border-color: rgba(255,92,110,.35);
    background: linear-gradient(180deg, rgba(255,92,110,.18), rgba(255,92,110,.08));
  }

  .controls{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:10px;
  }

  .controls button{
    padding:11px 16px;
    font-size:15px;
    font-weight:900;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    color: var(--text);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    cursor:pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .controls button:active{ transform:scale(.99); }

  .grid-btn{
    border-color: rgba(61,214,198,.35) !important;
    box-shadow: 0 12px 30px rgba(61,214,198,.10), 0 12px 30px rgba(0,0,0,.45);
  }

  .reset-btn{
    border-color: rgba(255,92,110,.35) !important;
    background: linear-gradient(180deg, rgba(255,92,110,.18), rgba(255,92,110,.08)) !important;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    z-index:999;
    display:none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  #panel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:1000;
    width:min(560px, 92vw);
    max-height:86vh;
    overflow-y:auto;
    overflow-x:hidden;
    padding:16px;
    border-radius:16px;
    background:transparent;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }

  .panel-header{
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.12);
    border-radius:16px;
    box-shadow: var(--shadow);
    padding:12px;
    margin-bottom:14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .panel-title{
    font-size:18px;
    font-weight:950;
    text-align:center;
    margin:0 0 10px;
    letter-spacing:.35px;
  }

  .panel-actions{
    display:flex;
    gap:10px;
  }
  .panel-actions button{
    flex:1;
    padding:11px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    color: var(--text);
    font-weight:950;
    cursor:pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,.45);
  }
  .panel-actions .danger{
    border-color: rgba(255,92,110,.35);
    background: linear-gradient(180deg, rgba(255,92,110,.18), rgba(255,92,110,.08));
  }

  .exercise-card{
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.12);
    border-radius:16px;
    box-shadow: var(--shadow);
    padding:16px 16px 14px;
    margin-bottom:18px;
    position:relative;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .exercise-card img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:14px;
    display:block;
    margin:0 auto 10px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow: 0 14px 34px rgba(0,0,0,.55);
  }

  .exercise-title{
    text-align:center;
    font-size:18px;
    font-weight:950;
    letter-spacing:.35px;
    margin:0 0 10px;
  }

  .exercise-actions{
    display:flex;
    gap:10px;
    margin:10px 0 6px;
  }
  .exercise-actions button{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    color: var(--text);
    font-weight:950;
    cursor:pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,.45);
  }
  .exercise-actions .danger{
    border-color: rgba(255,92,110,.35);
    background: linear-gradient(180deg, rgba(255,92,110,.18), rgba(255,92,110,.08));
  }

  .chart-wrapper{
    display:inline-block;
    width:fit-content;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border-radius:14px;
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.12);
    overflow:hidden;
  }
  .chart-wrapper + .chart-wrapper{ display:block; margin-top:12px; }

  .chart{
    display:grid;
    grid-template-columns:repeat(5,72px);
    grid-auto-rows:38px;
    gap:1px;
    background: rgba(255,255,255,.06);
  }

  .cell{
    background: rgba(12,16,22,.70);
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:650;
    padding:2px;
    user-select:none;
  }

  .chart-label{
    font-weight:950;
    letter-spacing:.35px;
    color: var(--gold2);
    background: linear-gradient(180deg, rgba(215,180,106,.18), rgba(12,16,22,.70));
  }

  .editable{
    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.14);
    cursor:text;
    font-weight:850;
  }
  .editable input{
    width:100%;
    height:100%;
    border:0;
    outline:none;
    background:transparent;
    text-align:center;
    font:inherit;
    color: var(--text);
    padding:2px 6px;
    -webkit-appearance:none;
    appearance:none;
  }
  .editable:focus-within{
    background: rgba(255,255,255,.10);
    border-bottom-color: rgba(61,214,198,.55);
    outline:none;
  }

  .plate{
    font-weight:850;
    color: rgba(255,255,255,.82);
    transition:background .15s ease, color .15s ease;
  }
  .plate.active{
    background: linear-gradient(180deg, rgba(61,214,198,.16), rgba(215,180,106,.12));
    color: #ffffff;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.68);
    z-index:3000;
    display:none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:3001;
    width:min(560px, 92vw);
    max-height:86vh;
    overflow-y:auto;
    overflow-x:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    box-shadow: var(--shadow);
    padding:14px;
    display:none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }
  .modal h3{
    margin:6px 0 10px;
    font-size:16px;
    font-weight:950;
    letter-spacing:.25px;
  }
  .modal .row{
    display:flex;
    gap:10px;
    margin:10px 0;
  }
  .modal input{
    width:100%;
    padding:12px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(12,16,22,.55);
    color: var(--text);
    font-weight:800;
    font-size:14px;
    outline:none;
  }
  .modal input:focus{
    border-color: rgba(61,214,198,.55);
    box-shadow: 0 0 0 3px rgba(61,214,198,.14);
  }
  .modal input[type="file"]{
    padding:10px;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
  }
  .modal .hint{
    font-size:12px;
    opacity:.82;
    line-height:1.25;
    margin-top:2px;
  }
  .modal .actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .modal .actions button{
    flex:1;
    padding:11px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    color: var(--text);
    font-weight:950;
    cursor:pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,.45);
  }
  .modal .actions .danger{
    border-color: rgba(255,92,110,.35);
    background: linear-gradient(180deg, rgba(255,92,110,.18), rgba(255,92,110,.08));
  }

  /* ===== Group List Sort UI ===== */
  .gl-toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:8px 0 10px;
  }
  .gl-pill{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    color: var(--text);
    font-weight:950;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
    text-align:center;
    user-select:none;
  }
  .gl-pill.active{
    border-color: rgba(61,214,198,.45);
    box-shadow: 0 10px 24px rgba(61,214,198,.12), 0 10px 24px rgba(0,0,0,.45);
  }
  .gl-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:58vh;
    overflow:auto;
    padding-right:2px;
  }
  .gl-item{
    display:flex;
    gap:10px;
    align-items:center;
    border:1px solid rgba(255,255,255,.12);
    background: rgba(12,16,22,.55);
    border-radius:14px;
    padding:10px;
    box-shadow: 0 10px 22px rgba(0,0,0,.45);
  }
  .gl-item .name{
    flex:1;
    font-weight:950;
    letter-spacing:.2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gl-move{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .gl-move button{
    width:44px;
    padding:10px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
    color: var(--text);
    font-weight:950;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,.45);
  }
  .gl-move button:disabled{
    opacity:.35;
    cursor:not-allowed;
  }

  .percent-box{
    margin:12px 0;
    padding:12px;
    border-radius:14px;
    border:1px solid rgba(61,214,198,.24);
    background: linear-gradient(180deg, rgba(61,214,198,.08), rgba(255,255,255,.03));
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
  }
  .percent-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:950;
    cursor:pointer;
    user-select:none;
  }
  .percent-toggle input{
    width:auto;
    transform:scale(1.15);
  }
  .percent-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  .percent-preview{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .percent-preview-row{
    display:grid;
    grid-template-columns:1.2fr .8fr .8fr;
    gap:8px;
    align-items:center;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(12,16,22,.48);
    font-size:12px;
    font-weight:850;
  }
  .percent-preview-row strong{
    color:var(--gold2);
  }

  @media (max-width:420px){
    .chart{ grid-template-columns:repeat(5,64px); }
  }
</style>
</head>

<body>

<div id="groupsRoot"></div>

<div class="controls">
  <button onclick="addMuscleGroup()">+ Add Muscle Group</button>
  <button onclick="openGroupList()">Muscle Group List</button>
  <button class="grid-btn" id="gridToggleBtn" onclick="toggleGrid()">Grid: 3 Across</button>
  <button onclick="exportData()">Export</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <button class="reset-btn" onclick="resetBabeSculpting()">⚠️ RESET WORKOUT DATA ⚠️</button>
</div>

<div class="overlay" onclick="closePanel()"></div>
<div id="panel"></div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>

<script>
/* =======================
   STORAGE + DEFAULT DATA
======================= */
const APP_KEY = 'BSCULPT::APPDATA::v1';
const KEY_PREFIX = 'BSCULPT::';
const DEFAULT_SET_LABELS = ['Warm Up','1','2','3'];
const LONG_PRESS_MS = 550;
const GRID_KEY = 'BSCULPT::GRIDCOLS::v1';

function uid(){
  return 'g_' + Math.random().toString(16).slice(2) + Date.now().toString(16);
}

function defaultAppData(){
  return {
    version: 1,
    setLabels: [...DEFAULT_SET_LABELS],
    groups: [
      { id: uid(), name: 'Legs', img: '', exercises: [] },
      { id: uid(), name: 'Back', img: '', exercises: [] },
      { id: uid(), name: 'Biceps', img: '', exercises: [] },
      { id: uid(), name: 'Chest', img: '', exercises: [] },
      { id: uid(), name: 'Shoulders', img: '', exercises: [] },
      { id: uid(), name: 'Triceps', img: '', exercises: [] }
    ]
  };
}

function loadAppData(){
  try{
    const raw = localStorage.getItem(APP_KEY);
    if(!raw) {
      const d = defaultAppData();
      localStorage.setItem(APP_KEY, JSON.stringify(d));
      return d;
    }

    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.groups)) throw new Error('bad');

    if(!Array.isArray(parsed.setLabels) || parsed.setLabels.length === 0){
      parsed.setLabels = [...DEFAULT_SET_LABELS];
    }

    let upgraded = false;
    parsed.groups.forEach(group=>{
      (group.exercises || []).forEach(ex=>{
        if(!Array.isArray(ex.setLabels) || ex.setLabels.length === 0){
          ex.setLabels = [...parsed.setLabels];
          upgraded = true;
        }
        if(!ex.percentageConfig || typeof ex.percentageConfig !== 'object'){
          ex.percentageConfig = { enabled:false, maxWeight:0, maxReps:0 };
          upgraded = true;
        }
      });
    });

    if(upgraded){
      localStorage.setItem(APP_KEY, JSON.stringify(parsed));
    }

    return parsed;
  }catch{
    const d = defaultAppData();
    localStorage.setItem(APP_KEY, JSON.stringify(d));
    return d;
  }
}

function saveAppData(data){
  localStorage.setItem(APP_KEY, JSON.stringify(data));
}

let APP = loadAppData();
let CURRENT_GROUP_ID = null;

let BODY_SCROLL_Y = 0;

function lockBackgroundScroll(){
  if(document.body.classList.contains('modal-open')) return;

  BODY_SCROLL_Y = window.scrollY || document.documentElement.scrollTop || 0;

  document.documentElement.classList.add('modal-open');
  document.body.classList.add('modal-open');

  document.body.style.position = 'fixed';
  document.body.style.top = `-${BODY_SCROLL_Y}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}

function unlockBackgroundScroll(){
  const panelOpen = document.querySelector('.overlay')?.style.display === 'block';
  const modalOpen = document.getElementById('modalOverlay')?.style.display === 'block';

  if(panelOpen || modalOpen) return;

  document.documentElement.classList.remove('modal-open');
  document.body.classList.remove('modal-open');

  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';

  window.scrollTo(0, BODY_SCROLL_Y);
}

function stopBackgroundTouchScroll(e){
  const modal = document.getElementById('modal');
  const panel = document.getElementById('panel');

  const modalVisible = modal?.style.display === 'block';
  const panelVisible = document.querySelector('.overlay')?.style.display === 'block';

  if(modalVisible){
    if(!e.target.closest('#modal')){
      e.preventDefault();
    }
    return;
  }

  if(panelVisible && !e.target.closest('#panel')){
    e.preventDefault();
  }
}

document.addEventListener('touchmove', stopBackgroundTouchScroll, {passive:false});

function installTouchScrollContainment(el){
  if(!el || el.dataset.touchContainmentInstalled === '1') return;
  el.dataset.touchContainmentInstalled = '1';

  let startY = 0;

  el.addEventListener('touchstart', (e)=>{
    if(!e.touches?.length) return;
    startY = e.touches[0].clientY;
  }, {passive:true});

  el.addEventListener('touchmove', (e)=>{
    if(!e.touches?.length) return;

    const currentY = e.touches[0].clientY;
    const deltaY = currentY - startY;

    const atTop = el.scrollTop <= 0;
    const atBottom = Math.ceil(el.scrollTop + el.clientHeight) >= el.scrollHeight;

    const tryingPastTop = atTop && deltaY > 0;
    const tryingPastBottom = atBottom && deltaY < 0;

    if((tryingPastTop || tryingPastBottom) && el.scrollHeight > el.clientHeight){
      e.preventDefault();
    }
  }, {passive:false});
}

window.addEventListener('DOMContentLoaded', ()=>{
  installTouchScrollContainment(document.getElementById('panel'));
  installTouchScrollContainment(document.getElementById('modal'));
});

function getDefaultSetLabels(){
  if(Array.isArray(APP.setLabels) && APP.setLabels.length){
    return [...APP.setLabels];
  }
  return [...DEFAULT_SET_LABELS];
}

function getExerciseSetLabels(ex){
  if(ex && Array.isArray(ex.setLabels) && ex.setLabels.length){
    return ex.setLabels;
  }
  return getDefaultSetLabels();
}

/* =======================

/* =======================
   LABEL AUTO-FIT
======================= */
let fitQueued = false;
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

function queueLabelFit(){
  if(fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(()=>{
    fitQueued = false;
    fitAllGroupLabels();
  });
}

function fitLabelFont(labelEl){
  if(!labelEl) return;
  const tile = labelEl.closest('.thumbnail-container');
  if(!tile) return;

  const tileW = tile.clientWidth || 200;
  const textLen = (labelEl.textContent || '').trim().length;

  const baseMax = clamp(Math.floor(tileW / 10), 14, 24);
  const lengthPenalty = clamp(Math.floor((textLen - 10) / 4), 0, 6);
  const maxPx = clamp(baseMax - lengthPenalty, 12, 24);
  const minPx = 10;

  labelEl.style.fontSize = maxPx + 'px';
  let size = maxPx;
  while(size > minPx && labelEl.scrollWidth > labelEl.clientWidth){
    size -= 1;
    labelEl.style.fontSize = size + 'px';
  }
}

function fitAllGroupLabels(){
  document.querySelectorAll('#groupsRoot .thumbnail-container .label')
    .forEach(fitLabelFont);
}
window.addEventListener('resize', queueLabelFit);

function attachLongPressHandlers(tile, groupId){
  let timer = null;

  function startPress(){
    clearTimeout(timer);
    timer = setTimeout(()=>{
      hideAllGroupActions();
      tile.classList.add('show-actions');
      tile.style.transform = 'translateY(-2px) scale(1.02)';
      setTimeout(()=>{ tile.style.transform=''; }, 140);
    }, LONG_PRESS_MS);
  }
  function endPress(){ clearTimeout(timer); }

  tile.addEventListener('touchstart', startPress, {passive:true});
  tile.addEventListener('touchend', endPress, {passive:true});
  tile.addEventListener('touchmove', endPress, {passive:true});
  tile.addEventListener('touchcancel', endPress, {passive:true});

  tile.addEventListener('mousedown', startPress);

/* =======================
   WORKOUT ENTRY CHART
======================= */
function safeKey(str){ return String(str).replace(/\s+/g,' ').trim(); }

function buildChart(groupName, exName, label){
  const key=`${KEY_PREFIX}${safeKey(groupName)}::${safeKey(exName)}::${safeKey(label)}`;
  const saved=JSON.parse(localStorage.getItem(key)||'{}');

  const wrapper=document.createElement('div');
  wrapper.className='chart-wrapper';

  wrapper.innerHTML=`
    <div class="chart">
      <div class="cell chart-label">${escapeHtml(label)}</div>

      <div class="cell editable" style="grid-column:2/span 2">
        <input
          class="rep-input"
          type="number"
          inputmode="numeric"
          step="1"
          min="0"
          placeholder="reps"
          value="${saved.set > 0 ? saved.set : ''}"
        >
      </div>

      <div class="cell editable" style="grid-column:4/span 2">
        <input
          class="weight-input"
          type="number"
          inputmode="decimal"
          step="0.5"
          min="0"
          placeholder="lbs"
          value="${saved.weight > 0 ? saved.weight : ''}"
        >
      </div>

      ${[45,25,10,5,2.5].map(p=>`<div class="cell plate" data-w="${p}">${p} × 0</div>`).join('')}
    </div>`;

  const repInput=wrapper.querySelector('.rep-input');
  const weightInput=wrapper.querySelector('.weight-input');
  const plates=[...wrapper.querySelectorAll('.plate')];

  function update(){
    let w=parseFloat(weightInput.value)||0, r=w;

    plates.forEach(p=>{
      const pw=+p.dataset.w;
      const c=Math.floor(r/pw); r-=c*pw;
      p.textContent=`${pw} × ${c}`;
      p.classList.toggle('active',c>0);
    });

    const reps=parseInt(repInput.value);
    const repsSafe = Number.isFinite(reps) ? reps : 0;
    localStorage.setItem(key, JSON.stringify({weight:w,set:repsSafe}));
  }

  repInput.oninput=update;
  weightInput.oninput=update;
  update();
  return wrapper;
}

/* =======================
   SET / CHART SETTINGS
   (PER EXERCISE)
======================= */
function roundToNearest2_5(value){
  return Math.round((Number(value) || 0) / 2.5) * 2.5;
}

function formatWeight(value){
  const n = Number(value) || 0;
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

/*
  Percentage breakdown:
  Set 1: Warm Up = 50% of max
  Set 2: Max = 100% of max
  Set 3+: 80% of the immediately previous working set

  Reps:
  Warm Up = max reps + 2
  Max = max reps
  Set 3 = max reps + 2
  Set 4 = max reps + 4
  ...continuing +2 reps per additional set.
*/
function calculatePercentageBreakdown(setCount, maxWeight, maxReps){
  const count = Math.max(1, parseInt(setCount, 10) || 1);
  const maxW = Math.max(0, Number(maxWeight) || 0);
  const maxR = Math.max(0, parseInt(maxReps, 10) || 0);

  const rows = [];

  for(let i = 0; i < count; i++){
    let weight = 0;
    let reps = maxR;
    let suggestedLabel = `Set ${i + 1}`;

    if(i === 0){
      weight = roundToNearest2_5(maxW * 0.5);
      reps = maxR + 2;
      suggestedLabel = 'Warm Up';
    }else if(i === 1){
      weight = roundToNearest2_5(maxW);
      reps = maxR;
      suggestedLabel = 'Max';
    }else{
      const previousWeight = rows[i - 1].weight;
      weight = roundToNearest2_5(previousWeight * 0.8);
      reps = maxR + ((i - 1) * 2);
      suggestedLabel = `Set ${i + 1}`;
    }

    rows.push({
      index: i,
      weight,
      reps,
      suggestedLabel
    });
  }

  return rows;
}

function renderSetLabelInputs(count, suppliedValues = null){

  if(countInput && String(countInput.value) !== String(n)){
    countInput.value = n;
  }

  let currentValues = [];

  if(Array.isArray(suppliedValues)){
    currentValues = [...suppliedValues];
  }else{
    currentValues = [...container.querySelectorAll('.set-label-input')]
      .map(input => input.value);
  }

  container.innerHTML = '';

  for(let i = 0; i < n; i++){
    let value = currentValues[i] !== undefined ? currentValues[i] : `Set ${i + 1}`;

    const row = document.createElement('div');
    row.className = 'row';

function applySuggestedPercentageLabels(){
  const enabled = !!document.getElementById('percentageEnabled')?.checked;
  if(!enabled) return;

  const count = parseInt(document.getElementById('setCount')?.value, 10) || 1;
  const inputs = [...document.querySelectorAll('#setLabelsContainer .set-label-input')];

  inputs.forEach((input, index)=>{
    if(index === 0 && (!input.value.trim() || /^set\s*1$/i.test(input.value.trim()))){
      input.value = 'Warm Up';
    }else if(index === 1 && (!input.value.trim() || /^set\s*2$/i.test(input.value.trim()))){
      input.value = 'Max';
    }else if(index >= 2 && !input.value.trim()){
      input.value = `Set ${index + 1}`;
    }
  });
}

function updatePercentagePreview(){
  const preview = document.getElementById('percentagePreview');
  if(!preview) return;

  const enabled = !!document.getElementById('percentageEnabled')?.checked;
  if(!enabled){
    preview.innerHTML = '';
    return;
  }

  applySuggestedPercentageLabels();

  const setCount = parseInt(document.getElementById('setCount')?.value, 10) || 1;
  const maxWeight = Number(document.getElementById('percentageMaxWeight')?.value) || 0;
  const maxReps = parseInt(document.getElementById('percentageMaxReps')?.value, 10) || 0;
  const labels = [...document.querySelectorAll('#setLabelsContainer .set-label-input')]
    .map((input, i)=>input.value.trim() || `Set ${i + 1}`);

  if(maxWeight <= 0 || maxReps <= 0){
    preview.innerHTML = `
      <div class="hint">Enter max weight and max reps to preview the breakdown.</div>
    `;
    return;
  }

  const rows = calculatePercentageBreakdown(setCount, maxWeight, maxReps);

  preview.innerHTML = rows.map((row, i)=>`
    <div class="percent-preview-row">
      <strong>${escapeHtml(labels[i] || row.suggestedLabel)}</strong>
      <span>${formatWeight(row.weight)} lb</span>
      <span>${row.reps} reps</span>
    </div>
  `).join('');
}

function confirmSetSettings(groupId, exId){
  const g = APP.groups.find(x=>x.id===groupId);
  const ex = g?.exercises.find(e=>e.id===exId);
  if(!g || !ex) return;

  const inputs = [...document.querySelectorAll('#setLabelsContainer .set-label-input')];

  if(inputs.length === 0){
    alert('You must have at least one set.');
    return;
  }

  const newLabels = inputs.map(input => input.value.trim());

  if(newLabels.some(label => !label)){
    alert('Every set must have a label.');
    return;
  }

  const normalized = newLabels.map(label => safeKey(label).toLowerCase());

  if(new Set(normalized).size !== normalized.length){
    alert('Each set label must be unique within this exercise.');
    return;
  }

  const percentageEnabled = !!document.getElementById('percentageEnabled')?.checked;
  const maxWeight = Number(document.getElementById('percentageMaxWeight')?.value) || 0;
  const maxReps = parseInt(document.getElementById('percentageMaxReps')?.value, 10) || 0;

  if(percentageEnabled && (maxWeight <= 0 || maxReps <= 0)){
    alert('Enter both max weight and max reps for the percentage breakdown.');
    return;
  }

  const oldLabels = [...getExerciseSetLabels(ex)];

  migrateWorkoutKeys_ExerciseSetLabels(g, ex, oldLabels, newLabels);

  ex.setLabels = newLabels;
  ex.percentageConfig = {
    enabled: percentageEnabled,
    maxWeight: percentageEnabled ? maxWeight : 0,
    maxReps: percentageEnabled ? maxReps : 0
  };

  saveAppData(APP);

  if(percentageEnabled){
    applyPercentageBreakdownToExercise(g, ex);
  }

  closeModal();

  if(CURRENT_GROUP_ID === groupId){
    openGroupPanel(groupId);
  }
}

function migrateWorkoutKeys_ExerciseSetLabels(group, ex, oldLabels, newLabels){
  const oldValues = oldLabels.map(label=>{
    const key =
      `${KEY_PREFIX}${safeKey(group.name)}::` +
      `${safeKey(ex.name)}::${safeKey(label)}`;
    return localStorage.getItem(key);
  });

  oldLabels.forEach(label=>{
    const key =
      `${KEY_PREFIX}${safeKey(group.name)}::` +
      `${safeKey(ex.name)}::${safeKey(label)}`;
    localStorage.removeItem(key);
  });

  newLabels.forEach((label, index)=>{
    if(index >= oldValues.length) return;
    const raw = oldValues[index];
    if(raw === null) return;

    const newKey =
      `${KEY_PREFIX}${safeKey(group.name)}::` +
      `${safeKey(ex.name)}::${safeKey(label)}`;

    localStorage.setItem(newKey, raw);
  });
}

function applyPercentageBreakdownToExercise(group, ex){
  const cfg = ex.percentageConfig;
  if(!cfg || !cfg.enabled) return;

  const labels = getExerciseSetLabels(ex);
  const rows = calculatePercentageBreakdown(
    labels.length,
    cfg.maxWeight,
    cfg.maxReps
  );

  rows.forEach((row, index)=>{
    const label = labels[index];
    if(!label) return;

    const key =
      `${KEY_PREFIX}${safeKey(group.name)}::` +
      `${safeKey(ex.name)}::${safeKey(label)}`;

    localStorage.setItem(key, JSON.stringify({
      weight: row.weight,
      set: row.reps
    }));
  });
}

    ? [...APP.groups].sort((a,b)=>String(a.name).localeCompare(String(b.name)))
    : [...APP.groups];

  body.innerHTML = '';

  list.forEach((g, idx)=>{

  });

function moveGroupInUserOrder(groupId, dir){
  const i = APP.groups.findIndex(g=>g.id===groupId);
  if(i < 0) return;
  const j = i + dir;
  if(j < 0 || j >= APP.groups.length) return;

  const tmp = APP.groups[i];
  APP.groups[i] = APP.groups[j];
  APP.groups[j] = tmp;

  saveAppData(APP);
  renderGroupListBody();
  renderGroups();
}

}

/* =======================
   KEY MIGRATIONS
======================= */
function migrateWorkoutKeys_GroupRename(oldGroup, newGroup){
  const oldPrefix = `${KEY_PREFIX}${safeKey(oldGroup)}::`;
  const keys = Object.keys(localStorage).filter(k => k.startsWith(oldPrefix));
  keys.forEach(oldKey=>{
    const v = localStorage.getItem(oldKey);
    const rest = oldKey.slice(oldPrefix.length);
    const newKey = `${KEY_PREFIX}${safeKey(newGroup)}::${rest}`;
    localStorage.setItem(newKey, v);
    localStorage.removeItem(oldKey);
  });
}

function migrateWorkoutKeys_ExerciseRename(groupName, oldEx, newEx, ex){
  const base = `${KEY_PREFIX}${safeKey(groupName)}::`;

  getExerciseSetLabels(ex).forEach(label=>{
    const oldKey = `${base}${safeKey(oldEx)}::${safeKey(label)}`;
    const v = localStorage.getItem(oldKey);

    if(v !== null){
      const newKey = `${base}${safeKey(newEx)}::${safeKey(label)}`;
      localStorage.setItem(newKey, v);
      localStorage.removeItem(oldKey);
    }
  });
}

/* =======================
   EXPORT / IMPORT (supports v4 + older v2)
======================= */
function exportData(){
  const out = {
    meta:{ app:'Body Sculpt', version:4, exportedAt:new Date().toISOString() },
    appData: APP,
    gridCols: getGridCols(),
    workouts: {}
  };

  Object.keys(localStorage).forEach(k=>{
    if(!k.startsWith(KEY_PREFIX)) return;
    if(k === APP_KEY) return;
    if(k === GRID_KEY) return;

    const raw = localStorage.getItem(k);
    try{
      out.workouts[k] = JSON.parse(raw);
    }catch{
      out.workouts[k] = raw;
    }
  });

  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'babe_sculpting_data.json';
  a.click();
}

document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();

  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);

      Object.keys(localStorage).forEach(k=>{
        if(!k.startsWith(KEY_PREFIX)) return;
        if(k === APP_KEY) return;
        if(k === GRID_KEY) return;
        localStorage.removeItem(k);
      });

      if(d && d.appData && Array.isArray(d.appData.groups)){
        APP = d.appData;

        if(!Array.isArray(APP.setLabels) || APP.setLabels.length === 0){
          APP.setLabels = [...DEFAULT_SET_LABELS];
        }

        APP.groups.forEach(group=>{
          (group.exercises || []).forEach(ex=>{
            if(!Array.isArray(ex.setLabels) || ex.setLabels.length === 0){
              ex.setLabels = [...APP.setLabels];
            }
            if(!ex.percentageConfig || typeof ex.percentageConfig !== 'object'){
              ex.percentageConfig = { enabled:false, maxWeight:0, maxReps:0 };
            }
          });
        });

        saveAppData(APP);

        if(typeof d.gridCols === 'number') applyGridCols(d.gridCols);

        if(d.workouts && typeof d.workouts === 'object'){
          Object.keys(d.workouts).forEach(k=>{
            if(!k.startsWith(KEY_PREFIX)) return;
            if(k === APP_KEY) return;
            if(k === GRID_KEY) return;
            const v = d.workouts[k];
            localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v ?? {}));
          });
        }

        alert('Import complete.');
        renderGroups();
        closePanel();
        return;
      }

      if(d && Array.isArray(d.groups) && d.groups.length){
        const defaults = defaultAppData().groups;
        const defByName = (name)=>defaults.find(g=>g.name === name);

        const newGroups = d.groups.map(g=>{
          const defG = defByName(g.group);
          const groupImg = defG?.img || '';

          const exercises = (g.exercises || []).map(ex=>{
            const defEx = defG?.exercises?.find(x=>x.name === ex.name);
            const labels = [];

            (ex.charts || []).forEach(c=>{
              if(!c || !c.label) return;
              const label = String(c.label).trim();
              if(label && !labels.some(existing => existing.toLowerCase() === label.toLowerCase())){
                labels.push(label);
              }
            });

            return {
              id: uid(),
              name: ex.name,
              img: defEx?.img || '',
              setLabels: labels.length ? labels : [...DEFAULT_SET_LABELS],
              percentageConfig: { enabled:false, maxWeight:0, maxReps:0 }
            };
          });

          return { id: uid(), name: g.group, img: groupImg, exercises };
        });

        const importedLabels = [];

        d.groups.forEach(g=>{
          (g.exercises || []).forEach(ex=>{
            (ex.charts || []).forEach(c=>{
              if(!c || !c.label) return;

              const label = String(c.label).trim();

              if(
                label &&
                !importedLabels.some(
                  existing => existing.toLowerCase() === label.toLowerCase()
                )
              ){
                importedLabels.push(label);
              }
            });
          });
        });

        APP = {
          version: 1,
          setLabels: importedLabels.length
            ? importedLabels
            : [...DEFAULT_SET_LABELS],
          groups: newGroups
        };

        saveAppData(APP);

        d.groups.forEach(g=>{
          (g.exercises || []).forEach(ex=>{
            (ex.charts || []).forEach(c=>{
              if(!c || !c.label) return;
              const k = `${KEY_PREFIX}${safeKey(g.group)}::${safeKey(ex.name)}::${safeKey(c.label)}`;
              localStorage.setItem(k, JSON.stringify({
                weight: Number(c.weight) || 0,
                set: Number(c.set) || 0
              }));
            });
          });
        });

        if(typeof d.gridCols === 'number') applyGridCols(d.gridCols);

        alert('Import complete.');
        renderGroups();
        closePanel();
        return;
      }

      alert('Import failed. Unrecognized file format.');
    }catch(err){
      alert('Import failed. Invalid file.');
    }
  };

  r.readAsText(f);
};

======================= */
function resetBabeSculpting(){
  if(!confirm('This will ERASE ALL Body Sculpt data (groups, exercises, workout entries). Continue?')) return;

  Object.keys(localStorage)
    .filter(k => k.startsWith(KEY_PREFIX))
    .forEach(k => localStorage.removeItem(k));

  localStorage.removeItem(APP_KEY);

  APP = loadAppData();
  renderGroups();
  closePanel();
}
